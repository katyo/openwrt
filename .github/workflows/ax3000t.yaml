name: Build Xiaomi AX3000T
on: [push]

env:
  PACKAGES: |
    wpad-basic-mbedtls=m
    libwolfsslcpu-crypto=y
    wpad-wolfssl=y
    dnsmasq=m
    dnsmasq-full=y
    kmod-nf-nathelper=y
    kmod-nf-nathelper-extra=y
    kmod-nft-queue=y
    kmod-nft-compat=y
    kmod-ipt-core=y
    kmod-ip6tables=y
    luci=y
    luci-proto-wireguard=y
    xl2tpd=y
    mdio-tools=y
    luci-theme-material=y
    luci-app-upnp=y
    luci-app-nft-qos=y
    luci-app-wol=y
    luci-app-ddns=y
    luci-app-adblock-fast=y
    gawk=y
    grep=y
    sed=y
    nano=y
    coreutils-sort=y
    zapret=y
    luci-app-zapret=y
  LANGUAGES: |
    ru=y

jobs:
    build:
        name: Prepare and build Xiaomi AX3000T
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Update and install feeds
              run: |
                echo "src-git zapret https://github.com/remittor/zapret-openwrt" >> feeds.conf.default
                ./scripts/feeds update -a
                ./scripts/feeds install -a

            - name: Generate config for Xiaomi AX3000T
              run: |
                echo "CONFIG_TARGET_mediatek=y" > .config
                echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
                echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
                echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config
                echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y" >> .config
                echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-ubootmod=y" >> .config
                echo "${PACKAGES}" | grep -v '^$' | sed 's/^.*$/CONFIG_PACKAGE_\0/g' >> .config
                echo "${LANGUAGES}" | grep -v '^$' | sed 's/^.*$/CONFIG_LUCI_LANG_\0/g' >> .config
                cat .config
                make defconfig

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: |
                make tools/install -j$(nproc) V=s || \
                make tools/install V=s

            - name: Build toolchain
              run: |
                make toolchain/install -j$(nproc) V=s || \
                make toolchain/install V=s

            - name: Build target images
              run: |
                make -j$(nproc) V=s || \
                make V=s

            - name: TAR output
              run: tar -cvf filogicx-images.tar bin/targets/mediatek/filogic/

            - name: Upload artifacts
              uses: actions/upload-artifact@v3
              with:
                name: filogic-images
                path: filogicx-images.tar

    release:
          name: Make a release
          runs-on: ubuntu-latest
          needs: build

          steps:
            - name: Download the image artifacts
              uses: actions/download-artifact@v3
              with:
                name: filogic-images

            - name: Extract the image artifacts
              run: tar xf filogicx-images.tar

            - name: Get the current date
              run: echo "NOW=$(date +%F)" >> $GITHUB_ENV

            - name: Create a release
              uses: "marvinpinto/action-automatic-releases@latest"
              with:
                repo_token: "${{ secrets.GITHUB_TOKEN }}"
                prerelease: true
                title: "Xiaomi AX3000T ${{ env.NOW }}"
                automatic_release_tag: "filogic-${{ env.NOW }}"
                auto_generate_release_notes: true
                files: bin/targets/mediatek/filogic/*
