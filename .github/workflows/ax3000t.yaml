name: Build Xiaomi AX3000T
on: [push]

jobs:
    build:
        name: Prepare and build Xiaomi AX3000T
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Update and install feeds
              run: make -f .github/workflows/build.mk prepare

            - name: Generate config for Xiaomi AX3000T
              run: make -f .github/workflows/build.mk config

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: make -f .github/workflows/build.mk tools

            - name: Build toolchain
              run: make -f .github/workflows/build.mk toolchain

            - name: Build target images
              run: make -f .github/workflows/build.mk

            - name: TAR output
              run: tar -cvf filogicx-images.tar bin/targets/mediatek/filogic/

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: filogic-images
                path: filogicx-images.tar

    release:
          name: Make a release
          runs-on: ubuntu-latest
          needs: build

          steps:
            - name: Download the image artifacts
              uses: actions/download-artifact@v4
              with:
                name: filogic-images

            - name: Extract the image artifacts
              run: tar xf filogicx-images.tar

            - name: Get the current date
              run: echo "NOW=$(date +%F)" >> $GITHUB_ENV

            - name: Create a release
              uses: "marvinpinto/action-automatic-releases@latest"
              with:
                repo_token: "${{ secrets.GITHUB_TOKEN }}"
                prerelease: true
                title: "Xiaomi AX3000T ${{ env.NOW }}"
                automatic_release_tag: "filogic-${{ env.NOW }}"
                auto_generate_release_notes: true
                files: bin/targets/mediatek/filogic/*
