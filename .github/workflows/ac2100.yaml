name: Build Xiaomi AC2100
on: [push]

env:
    TARGET: ac2100
    DEVICE: Xiaomi AC2100
    BINDIR: bin/targets/ramips/mt7621

jobs:
    build:
        name: Prepare and build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Update and install feeds
              run: make -f .github/workflows/build.mk prepare

            - name: Generate config
              run: make -f .github/workflows/build.mk config

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: make -f .github/workflows/build.mk tools

            - name: Build toolchain
              run: make -f .github/workflows/build.mk toolchain

            - name: Build target images
              run: make -f .github/workflows/build.mk

            - name: TAR output
              run: tar -cvf ${{ env.TARGET }}-images.tar -C ${{ env.BINDIR }} --transform 's;^;images/;' -- .

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.TARGET }} images
                path: ${{ env.TARGET }}-images.tar

    release:
          name: Make a release
          runs-on: ubuntu-latest
          needs: build

          steps:
            - name: Download the image artifacts
              uses: actions/download-artifact@v4
              with:
                name: ${{ env.TARGET }} images

            - name: Extract the image artifacts
              run: tar xf ${{ env.TARGET }}-images.tar

            - name: Get the current date
              run: echo "NOW=$(date +%F)" >> $GITHUB_ENV

            - name: Create a release
              uses: "marvinpinto/action-automatic-releases@latest"
              with:
                repo_token: "${{ secrets.GITHUB_TOKEN }}"
                prerelease: true
                title: "${{ env.DEVICE }} ${{ env.NOW }}"
                automatic_release_tag: "${{ env.TARGET }}-${{ env.NOW }}"
                auto_generate_release_notes: true
                files: images/*
